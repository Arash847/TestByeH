name: build

on:
  push:
    branches: [ main, 8.60-port ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build payloads (SDK)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget unzip make

      # The SDK publishes a prebuilt binary distribution, so there is no
      # need to build the cross toolchain itself in CI.
      - name: Fetch PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o ps5-payload-sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Show SDK layout
        run: ls -la "$PS5_PAYLOAD_SDK"

      # break_hv.h is generated by build.sh and compiled to a flat binary
      # using host tools, so the AP payload is staged before the ELFs.
      - name: Stage AP payload header
        run: |
          export PATH="/opt/ps5-payload-sdk/bin:$PATH"
          make break_hv_payload/break_hv.h || true

      # Built without -Werror so a diagnostic warning does not hide the
      # real build state; genuine errors still fail the job.
      - name: Build 8.60 read-only probe
        run: make probe-0860 CFLAGS="-Wall -Wno-unused-function -g -O0 -I./include"

      - name: Build main payload
        run: make all
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-payloads
          if-no-files-found: warn
          path: |
            byepervisor_probe_0860.elf
            byepervisor_reborn.elf
            break_hv_payload/break_hv.bin

  audit:
    name: Offset table audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Guard against populated-but-unvalidated 8.60 table
        run: |
          # The 8.60 table must not be flipped to READY while its entries
          # are still zero. That combination would emit a chain built from
          # ktext(0) and is the single most dangerous state this repo can
          # be pushed into.
          if grep -q '#define G_GADGET_MAP_0860_READY 1' include/offsets/8_60.h; then
            nonzeros=$(grep -c '^  0x' include/offsets/8_60.h || true)
            echo "GADGET_MAP_0860_READY=1 with $nonzeros non-zero entries"
            if [ "$nonzeros" -lt 21 ]; then
              echo "::error::8.60 gadget table marked ready but incomplete"
              exit 1
            fi
          fi
          echo "8.60 table guard OK"
