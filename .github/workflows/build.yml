name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build payloads (SDK)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget unzip make

      # The SDK publishes a prebuilt binary distribution, so the cross
      # toolchain does not need building in CI.
      - name: Fetch PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o ps5-payload-sdk.zip -d /opt
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build payloads
        run: make all

      - name: Build 8.60 dumper (conservative)
        run: make dump860

      - name: Build 8.60 dumper (fast variant)
        run: make dump860 FAST=1

      - name: Build PML4 census diagnostic
        run: make probe-pml4

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byepervisor-payloads
          if-no-files-found: warn
          path: |
            byepervisor_reborn.elf
            byepervisor_dump_0860.elf
            byepervisor_dump_0860_fast.elf
            byepervisor_pml4_0860.elf

  audit:
    name: Safety audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unsupported firmware must not fall through
        run: |
          # Upstream dropped the `return 1` after the "firmware not
          # supported" notice, so on an unsupported firmware the payload
          # warned and then carried on into the exploit with a NULL hook
          # target, entered rest mode, and hard power-offed the console.
          # Observed on a slim 8.60 unit running that build.
          python3 - <<'PY'
          import re, sys
          src = open("main.c").read()
          m = re.search(r"if \(kdlsym\(KERNEL_SYM_HV_MP_STARTUP_CALL\) == 0\) \{(.*?)\n  \}", src, re.S)
          if not m:
              print("::error::could not locate the unsupported-firmware guard")
              sys.exit(1)
          if "return" not in m.group(1):
              print("::error::unsupported-firmware path has no return; it falls "
                    "through into the exploit and power offs the console")
              sys.exit(1)
          print("unsupported-firmware guard returns correctly")
          PY

      - name: Guard against a populated-but-unvalidated 8.60 table
        run: |
          # The 8.60 table must never be flipped to READY while entries
          # are still zero: that emits a chain built from ktext(0), which
          # is the most dangerous state this repo can ship.
          if grep -q '#define G_GADGET_MAP_0860_READY 1' include/offsets/8_60.h; then
            nonzero=$(grep -cE '^  0x[1-9A-Fa-f]' include/offsets/8_60.h || true)
            echo "non-zero 8.60 entries: $nonzero (expect 35)"
            if [ "$nonzero" -lt 35 ]; then
              echo "::error::8.60 table marked ready but incomplete"
              exit 1
            fi
          fi
          echo "8.60 table guard OK"
